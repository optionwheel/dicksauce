<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dicksauce.lol</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 30px;
    }

    .video-frame {
      display: inline-block;
      padding: 10px;
      border: 4px solid #00ffff;
      border-radius: 20px;
      box-shadow:
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #00ffff;
      margin-bottom: 25px;
      animation: glow 2s infinite alternate;
    }

    .video-frame img {
      width: 320px;
      border-radius: 14px;
      display: block;
    }

    h1 {
      color: #00ffff;
      margin-bottom: 15px;
      text-shadow: 0 0 12px #00ffff;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #d9d9d9;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
      }
      to {
        box-shadow: 0 0 35px #00ffff, 0 0 70px #00ffff, 0 0 120px #00ffff;
      }
    }
  </style>
</head>
